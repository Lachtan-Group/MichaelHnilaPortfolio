  about:
    title: "Little about myself"
    lead: "Hey, I'm Michael and I break things to figure out how they work."
    p1: "I'm a self-taught developer from Slovakia, and I never really grew out of the \"but how does it actually work?\" phase. That's how I ended up building my own OAuth server just so I'd finally understand auth instead of copy-pasting it, self-hosting half my life on a Raspberry Pi because paying for a VPS felt like giving up, and writing Discord bots at 2am just because the idea wouldn't leave me alone."
    p2: "These days I spend most of my time in Vue on the frontend and Symfony on the backend, with Docker holding the whole mess together. I'm pretty picky about keeping code readable and keeping business logic where it belongs because I've been the guy coming back to his own code six months later with no idea what it does. Future-me appreciates the effort."
    p3: "The best feeling is still when something I built for myself turns out to be useful to someone else. That's why most of my projects start as \"I wish this existed\" and end up on GitHub at 3am with a README I promise I'll finish tomorrow."
